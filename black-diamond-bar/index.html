<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c10">
  <title>Black Diamond Bar · Stock &amp; Sales</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M8 4h16l6 8-14 16L2 12z' fill='%2311151c' stroke='%237dd3fc' stroke-width='2'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M8 4h16l6 8-14 16L2 12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M2 12h28M8 4l4 8 4-8 4 8 4-8M12 12l4 16 4-16" fill="none" stroke="currentColor" stroke-width="1" opacity=".6"/>
      </svg>
      <div>
        <div class="brand-name" id="barName">Black Diamond Bar</div>
        <div class="brand-sub">Stock &amp; Sales</div>
      </div>
    </div>
    <label class="staff-pick">
      <span>On shift</span>
      <select id="staffSelect" aria-label="Staff on shift"></select>
    </label>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="sell">Sell</button>
    <button data-view="products">Products</button>
    <button data-view="stock">Stock</button>
    <button data-view="watch">Stock Watch<span class="badge" id="watchBadge"></span></button>
    <button data-view="sales">Sales</button>
    <button data-view="staff">Staff &amp; Voids</button>
    <button data-view="reports">Reports</button>
    <button data-view="settings">Settings</button>
  </nav>

  <main id="view"></main>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <p class="error" id="modalError" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modalCancel">Cancel</button>
        <button type="submit" class="btn primary" id="modalOk">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
